# Nginx como proxy HTTPS hacia la app. Ajustar server_name y certificados.
server {
    listen 443 ssl;
    server_name combustible-ct.ejemplo.local;
    ssl_certificate     /etc/ssl/certs/combustible-ct.crt;
    ssl_certificate_key /etc/ssl/private/combustible-ct.key;
    client_max_body_size 10m;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
