# Uso: docker compose up -d   (requiere el archivo .env con la configuración de correo)
services:
  app:
    build: .
    image: combustible-ct:latest
    container_name: combustible-ct
    restart: unless-stopped
    env_file: .env
    environment:
      DB_FILE: /app/data/combustible-ct.db
      HOST: 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
