<style>
:root{
  --bg:#E9EDEF; --surface:#FFFFFF; --sunk:#F3F6F7; --ink:#18242A; --muted:#5B6971; --line:#CBD3D7;
  --petrol:#0F4C5C; --crit:#C42F28; --par:#2C6E8E; --hivis:#F2B705; --ok:#2E7D4F;
  --ph-d:#7A5C3E; --ph-t:#4E5D8C; --ph-m:#2F7A63;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111A1E; --surface:#18242A; --sunk:#141E23; --ink:#E4EBEE; --muted:#93A3AB; --line:#2B3A41;
    --petrol:#62AFC2; --crit:#EC6A62; --par:#72B4D6; --hivis:#F2C230; --ok:#5DC08A;
    --ph-d:#C49A6C; --ph-t:#8E9DD6; --ph-m:#62C2A2;
  }
}
:root[data-theme="dark"]{
  --bg:#111A1E; --surface:#18242A; --sunk:#141E23; --ink:#E4EBEE; --muted:#93A3AB; --line:#2B3A41;
  --petrol:#62AFC2; --crit:#EC6A62; --par:#72B4D6; --hivis:#F2C230; --ok:#5DC08A;
  --ph-d:#C49A6C; --ph-t:#8E9DD6; --ph-m:#62C2A2;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Barlow,"Segoe UI",Roboto,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--hivis);outline-offset:2px}
.wrap{max-width:1360px;margin:0 auto;padding:16px clamp(12px,3vw,28px) 48px}

.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:18px}
.top .brand{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:19px;letter-spacing:.02em;margin-right:auto;color:var(--petrol)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 12px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--petrol);border-color:var(--petrol);color:var(--surface)}
.btn.danger{color:var(--crit);border-color:var(--crit)}
.btn.small{padding:4px 9px;font-size:13px}
.btn.on{background:color-mix(in srgb,var(--hivis) 30%,var(--surface));border-color:var(--hivis)}
select.pick{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;max-width:300px}
.sync{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync[data-s="ok"] i{background:var(--ok)} .sync[data-s="pending"] i{background:var(--hivis)} .sync[data-s="err"] i{background:var(--crit)}

.hero{display:grid;grid-template-columns:1fr auto;gap:12px 24px;align-items:end;margin-bottom:14px}
.hero h1{margin:0;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:clamp(32px,5vw,48px);line-height:1;letter-spacing:-.01em}
.route{color:var(--muted);margin-top:6px}
.route b{color:var(--ink);font-weight:600}
.link-chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;margin-top:8px}
.link-chip i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.link-chip.ok i{background:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:0 0 16px;padding:0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.kpi dt{font-size:12.5px;color:var(--muted)}
.kpi dd{margin:2px 0 0;font-family:"Barlow Condensed",sans-serif;font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi dd.bad{color:var(--crit)} .kpi dd.ok{color:var(--ok)} .kpi dd.run{color:var(--par)}
@media (max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}.hero{grid-template-columns:1fr}}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}

.tabs{display:flex;gap:4px;border-bottom:2px solid var(--line);margin:0 0 16px;align-items:flex-end;overflow-x:auto}
.tab{border:none;background:none;padding:9px 16px;font-family:"Barlow Condensed",sans-serif;font-size:19px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--hivis)}
.tab .cnt{font-family:Barlow,sans-serif;font-size:12px;font-weight:600;background:var(--crit);color:#fff;border-radius:999px;padding:1px 7px;margin-left:6px;vertical-align:3px}
.logo-plate{display:inline-flex;align-items:center;background:#fff;border-radius:6px;padding:4px 8px;line-height:0}
.logo-plate img{display:block;height:100%;width:auto}
.logo-plate.in-tabs{margin-left:auto;height:44px;margin-bottom:6px;flex:none}
@media (max-width:560px){.logo-plate.in-tabs{height:34px}.tab{padding:8px 10px;font-size:17px}}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:18px clamp(12px,2.5vw,22px);margin-bottom:16px}
.h2{margin:0;font-family:"Barlow Condensed",sans-serif;font-size:28px;font-weight:700}
.h3{margin:0 0 10px;font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:600}
.sec-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin-bottom:10px}
.sec-h .h3{margin:0}
.sec-h .sub{color:var(--muted);font-size:13px;margin-right:auto}
.mut{color:var(--muted);font-size:13px}
.hint{color:var(--muted);font-size:13.5px;margin:-4px 0 12px;max-width:85ch}
.chip{display:inline-block;font-size:12.5px;font-weight:600;padding:2px 8px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.chip.ok{color:var(--ok)} .chip.bad{color:var(--crit)} .chip.run{color:var(--par)} .chip.idle{color:var(--muted);border-style:dashed} .chip.warn{color:var(--ink);background:color-mix(in srgb,var(--hivis) 35%,transparent);border-color:var(--hivis)}
.del{border:none;background:none;cursor:pointer;color:var(--muted);font-size:18px;line-height:1;padding:4px;border-radius:4px}
.del:hover{color:var(--crit)}

/* mapa */
.mapsec{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;margin-bottom:16px}
.mapsec[hidden]{display:none}
.mapbox{position:relative;border:1px solid var(--line);border-radius:6px;overflow:hidden;min-height:560px;background:var(--sunk)}
#map{position:absolute;inset:0}
.map-fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted)}
.maptools{position:absolute;top:10px;right:10px;z-index:500;display:flex;flex-direction:column;gap:6px}
.maptools .btn{box-shadow:0 1px 4px rgba(0,0,0,.25)}
.modebar{position:absolute;left:50%;transform:translateX(-50%);top:10px;z-index:600;background:var(--ink);color:var(--surface);border-radius:8px;padding:8px 10px 8px 14px;display:flex;flex-wrap:wrap;align-items:center;gap:8px;max-width:calc(100% - 140px);box-shadow:0 4px 18px rgba(0,0,0,.3);font-size:14px}
.modebar[hidden]{display:none}
.modebar .btn{color:var(--ink)}
.side{margin:0;padding:14px 16px;max-height:560px;overflow:auto}
.side h3{margin:0 0 8px;font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:600}
.side .blk{border-bottom:1px solid var(--line);padding:0 0 12px;margin:0 0 12px}
.side .blk:last-child{border-bottom:none;margin-bottom:0}
.pt{display:grid;grid-template-columns:22px 1fr auto;gap:2px 8px;align-items:center;margin-bottom:8px}
.pt .dot{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff}
.pt .dot.o{background:var(--ok)} .pt .dot.d{background:var(--crit)} .pt .dot.r{background:var(--hivis);color:#18242A}
.pt input{width:100%;border:1px solid transparent;background:transparent;border-radius:4px;padding:2px 5px;font-weight:600;min-width:0}
.pt input:hover{border-color:var(--line)} .pt input:focus{border-color:var(--petrol);background:var(--sunk);outline:none}
.pt small{grid-column:2/4;color:var(--muted);font-size:12px;padding-left:5px;font-variant-numeric:tabular-nums}
.ptx{grid-column:2/4;display:flex;gap:6px;margin-top:3px}
.ptx input{flex:1;font-weight:400;font-size:13px;border:1px solid var(--line);background:var(--sunk)}
.cfg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.cfg label{font-size:12px;color:var(--muted)}
.cfg input{width:100%;border:1px solid var(--line);border-radius:5px;padding:5px 7px;background:var(--sunk);color:var(--ink);font-size:14px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.tcard{border:1px solid var(--line);border-left:4px solid var(--par);border-radius:6px;padding:8px 10px;margin-bottom:8px;cursor:pointer;background:var(--surface)}
.tcard:hover{border-color:var(--muted)}
.tcard.alert{border-left-color:var(--crit)}
.tcard.sel{box-shadow:inset 0 0 0 2px var(--hivis)}
.tcard .l1{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.tcard .l1 b{font-family:"Barlow Condensed",sans-serif;font-size:18px;letter-spacing:.02em}
.tcard .l2{font-size:13px;color:var(--muted);margin:1px 0 6px}
.bar{height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--par);transition:width .6s linear}
.tcard.alert .bar i{background:var(--crit)}
.tcard .l3{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;color:var(--muted);margin-top:5px;align-items:center}
.alist{list-style:none;margin:0;padding:0;font-size:13px}
.alist li{display:grid;grid-template-columns:44px 1fr;gap:6px;padding:4px 0;border-bottom:1px solid var(--line)}
.alist li:last-child{border-bottom:none}
.alist time{color:var(--muted);font-variant-numeric:tabular-nums}
.alist .desvio,.alist .parada{color:var(--crit);font-weight:600}
.alist .llegada{color:var(--ok);font-weight:600}
@media (max-width:1000px){.mapsec{grid-template-columns:1fr}.mapbox{min-height:420px}.side{max-height:none}}
@media (max-width:560px){.mapbox{min-height:360px}.modebar{max-width:calc(100% - 20px);top:auto;bottom:10px}}

/* marcadores */
.mk{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font:700 12px Barlow,sans-serif;color:#fff;box-shadow:0 1px 5px rgba(0,0,0,.5)}
.mk.o{background:#2E7D4F} .mk.d{background:#C42F28}
.vx{position:absolute;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:#F2B705;border:2px solid #18242A}
.truck{position:absolute;transform:translate(-50%,-50%);display:flex;align-items:center;gap:4px;background:#0F4C5C;color:#fff;border:2px solid #fff;border-radius:6px;padding:2px 6px 2px 4px;font:600 12px "Barlow Condensed",Barlow,sans-serif;letter-spacing:.03em;white-space:nowrap;box-shadow:0 1px 6px rgba(0,0,0,.55)}
.truck svg{width:16px;height:16px;flex:none}
.truck.alert{background:#C42F28;animation:pulse 1.2s ease-in-out infinite}
.truck.done{background:#2E7D4F}
.truck.stale{background:#5B6971}
.truck.sel{outline:3px solid #F2B705}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(196,47,40,.35)}}
@media (prefers-reduced-motion:reduce){.truck.alert{animation:none}.bar i{transition:none}}

/* tablas */
.tw{overflow-x:auto}
.rt{width:100%;border-collapse:collapse;font-size:14px}
.rt th{text-align:left;font-size:12.5px;color:var(--muted);font-weight:600;border-bottom:2px solid var(--line);padding:6px 6px;white-space:nowrap}
.rt td{border-bottom:1px solid var(--line);padding:5px 6px;vertical-align:middle}
.rt td.num,.rt th.num{text-align:right;font-variant-numeric:tabular-nums}
.rt tr.sel td{background:color-mix(in srgb,var(--hivis) 16%,transparent)}
.rt input,.rt select{width:100%;border:1px solid transparent;background:transparent;border-radius:4px;padding:4px 5px;min-width:0}
.rt input:hover,.rt select:hover{border-color:var(--line)}
.rt input:focus,.rt select:focus{border-color:var(--petrol);background:var(--sunk);outline:none}
.rt input[type=number]{text-align:right;font-variant-numeric:tabular-nums}
.rt input[type=datetime-local]{min-width:170px;font-variant-numeric:tabular-nums}
.rt .acts{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;min-width:250px}
.rt td.w-name{min-width:220px}
.empty{color:var(--muted);padding:14px 0 4px}
.two{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
@media (max-width:1000px){.two{grid-template-columns:1fr}}

/* tira de días */
.strip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;margin:0 -2px 14px}
.day{flex:1 0 112px;min-width:112px;border:1px solid var(--line);background:var(--surface);border-radius:4px;cursor:pointer;text-align:left;padding:0;position:relative;overflow:hidden;display:flex;flex-direction:column}
.day .tank{height:58px;position:relative;background:var(--sunk);border-bottom:1px solid var(--line)}
.day .fill{position:absolute;left:0;right:0;bottom:0;background:var(--ph-t);opacity:.9}
.day .pct{position:absolute;right:8px;top:6px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:24px;line-height:1;color:var(--ink);text-shadow:0 0 6px var(--surface)}
.day .meta{padding:6px 8px 7px;font-size:12.5px;line-height:1.3}
.day .meta strong{display:block;font-family:"Barlow Condensed",sans-serif;font-size:16px;font-weight:600}
.day .meta span{color:var(--muted)}
.day[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 -3px 0 var(--ink)}
.day.today::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--hivis);z-index:2}
.day.off .fill{background:var(--muted)}
.linkbox{border:1px solid var(--line);border-radius:6px;background:var(--sunk);padding:12px 14px}
.linkbox p{margin:0 0 10px;font-size:14px}

/* diálogos */
dialog{border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:20px;width:min(500px,92vw)}
dialog::backdrop{background:rgba(10,20,25,.45)}
dialog h2{margin:0 0 14px;font-family:"Barlow Condensed",sans-serif;font-size:26px}
.field{display:block;margin-bottom:12px}
.field>span{display:block;font-size:13px;color:var(--muted);margin-bottom:3px}
.field input,.field select{width:100%;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--sunk)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.check{display:flex;gap:8px;align-items:flex-start;font-size:14px;margin:4px 0 16px}
.dlg-err{color:var(--crit);background:color-mix(in srgb,var(--crit) 10%,transparent);border-radius:6px;padding:8px 10px;font-size:14px;margin:0 0 12px}
.dlg-actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg-actions .left{margin-right:auto}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:6px;font-size:14px;max-width:min(560px,92vw);z-index:2000;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.toast.bad{background:var(--crit);color:#fff}
.blank{text-align:center;padding:60px 16px}
.blank h1{font-family:"Barlow Condensed",sans-serif;font-size:36px;margin:0 0 8px}
.blank p{color:var(--muted);max-width:60ch;margin:0 auto 18px}
.blank .btnrow{justify-content:center}
.proto{background:color-mix(in srgb,var(--hivis) 18%,transparent);border:1px solid var(--hivis);border-radius:6px;padding:8px 12px;font-size:13.5px;margin-bottom:14px}
.credit{max-width:1360px;margin:0 auto;padding:14px clamp(12px,3vw,28px) calc(20px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);color:var(--muted);font-size:13px;text-align:center}
.credit strong{color:var(--ink);font-weight:600}
@media (max-width:520px){.row3{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div id="head"></div>
  <section class="mapsec" id="mapSec" hidden>
    <div class="mapbox">
      <div id="map"></div>
      <div class="maptools"><button class="btn small" id="baseBtn" type="button">Ver mapa de calles</button><button class="btn small" id="fitBtn" type="button">Ver todo</button></div>
      <div class="modebar" id="modeBar" hidden></div>
    </div>
    <aside class="panel side" id="side"></aside>
  </section>
  <div id="view"></div>
</div>
<footer class="credit">Creado por: <strong>PÉREZ, Marcelo Damián</strong> - Supervisor de DTM D&amp;C - PAN AMERICAN ENERGY</footer>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h2 id="dlgTitle">Nuevo traslado</h2>
    <label class="field" id="segRow"><span>Vincular con un DTM de Seguimiento DTM</span><select name="dtm"></select></label>
    <label class="field"><span>Equipo</span><input name="equipo" required placeholder="Ej.: Equipo de perforación 08"></label>
    <label class="field"><span>Contratista / compañía de torre</span><input name="contratista" placeholder="Ej.: DLS"></label>
    <div class="row2">
      <label class="field"><span>Locación de origen</span><input name="origen" placeholder="Ej.: LCav-123"></label>
      <label class="field"><span>Locación de destino</span><input name="destino" placeholder="Ej.: LCav-124"></label>
    </div>
    <div class="row3">
      <label class="field"><span>Fecha de inicio del DTM</span><input name="fecha" type="date" required></label>
      <label class="field"><span>Hora de inicio</span><input name="hora" type="time" value="00:00"></label>
      <label class="field"><span>Días de plan</span><input name="dias" type="number" min="1" max="60" step="1" required></label>
    </div>
    <p class="dlg-err" id="dlgErr" role="alert" hidden></p>
    <label class="check" id="tplRow"><input type="checkbox" name="tpl" checked> <span>Cargar la lista típica de cargas de un equipo (se puede editar después)</span></label>
    <div class="dlg-actions">
      <button type="button" class="btn danger left" id="dlgDelete" hidden>Eliminar traslado</button>
      <button type="button" class="btn" id="dlgCancel">Cancelar</button>
      <button type="submit" class="btn primary" id="dlgOk">Crear traslado</button>
    </div>
  </form>
</dialog>
<dialog id="cfm">
  <h2 id="cfmTitle">Confirmar</h2>
  <p id="cfmMsg" style="margin:0 0 16px"></p>
  <div class="dlg-actions"><button type="button" class="btn" id="cfmNo">Cancelar</button><button type="button" class="btn danger" id="cfmYes">Aceptar</button></div>
</dialog>
<input type="file" id="fileRoute" accept=".kml,.kmz,.gpx,.geojson,.json,application/vnd.google-earth.kml+xml,application/vnd.google-earth.kmz,application/gpx+xml" hidden>
<input type="file" id="fileCsv" accept=".csv,.txt,text/csv" hidden>

/* ---------- utilidades ---------- */
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num=(v,d=0)=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:d};
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const plural=(n,s,p)=>n+" "+(n===1?s:p);
const DAY_MS=864e5;
const pad=n=>String(n).padStart(2,"0");
function hm2m(t){const m=/^(\d{1,2}):(\d{2})/.exec(t||"");return m?(+m[1])*60+(+m[2]):null}
function startMin(op){const m=hm2m(op&&op.horaInicio||"00:00");return m==null?0:m%1440}
function dayDate(op,dia){const p=(op.fechaInicio||"").split("-").map(Number);if(p.length!==3)return null;const sm=startMin(op);return new Date(p[0],p[1]-1,p[2]+dia-1,Math.floor(sm/60),sm%60)}
function dayOf(op,ts){const s=dayDate(op,1);return s&&ts?Math.floor((ts-s.getTime())/DAY_MS)+1:null}
function curDay(op){return dayOf(op,Date.now())}
const hhmm=x=>pad(x.getHours())+":"+pad(x.getMinutes());
function fmtDT(ts){if(!ts)return"";const x=new Date(ts);return x.toLocaleDateString("es-AR",{day:"2-digit",month:"2-digit"})+" "+hhmm(x)}
function fmtDay(x){return x?x.toLocaleDateString("es-AR",{weekday:"short",day:"2-digit",month:"2-digit"}):""}
function fmtDur(ms){if(ms==null||ms<0)return"";const m=Math.round(ms/60000);return m<60?m+" min":Math.floor(m/60)+" h "+pad(m%60)}
const fmtKm=m=>(m/1000).toLocaleString("es-AR",{maximumFractionDigits:m<10000?1:0})+" km";
const fmtM=m=>m<1000?Math.round(m)+" m":fmtKm(m);

function toLocalInput(ts){if(!ts)return"";const x=new Date(ts);return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate())+"T"+hhmm(x)}
function fromLocalInput(v){if(!v)return null;const t=new Date(v).getTime();return isFinite(t)?t:null}
function toast(msg,bad){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";t.setAttribute("role","status");document.body.appendChild(t)}t.className="toast"+(bad?" bad":"");t.textContent=msg;t.hidden=false;clearTimeout(t._h);t._h=setTimeout(()=>{t.hidden=true},bad?6000:3500)}
const normPat=s=>String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
const sameRig=(a,b)=>String(a||"").trim().toLowerCase()===String(b||"").trim().toLowerCase();

/* ---------- geometría ---------- */
const RT=6371000,rad=x=>x*Math.PI/180;
function dist(a,b){const dLat=rad(b[0]-a[0]),dLng=rad(b[1]-a[1]);const h=Math.sin(dLat/2)**2+Math.cos(rad(a[0]))*Math.cos(rad(b[0]))*Math.sin(dLng/2)**2;return 2*RT*Math.asin(Math.min(1,Math.sqrt(h)))}
function lenOf(pts){let s=0;for(let i=1;i<pts.length;i++)s+=dist(pts[i-1],pts[i]);return s}
const ll=p=>p&&isFinite(p.lat)&&isFinite(p.lng)?[p.lat,p.lng]:null;
const hasRoute=op=>!!(op.ruta&&op.ruta.pts&&op.ruta.pts.length>1);
/* recorrido completo: origen, ruta de la compañía de torre y destino */
function path(op){
  const out=[],add=p=>{if(p&&(!out.length||dist(out[out.length-1],p)>30))out.push(p)};
  add(ll(op.origen));((op.ruta&&op.ruta.pts)||[]).forEach(add);add(ll(op.destino));return out;
}
/* distancia mínima de p al recorrido y metros recorridos sobre él */
function nearest(pts,p){
  if(pts.length<2)return null;
  const k=Math.cos(rad(p[0])),X=q=>[(q[1]-p[1])*111320*k,(q[0]-p[0])*110574];
  let best=Infinity,along=0,acc=0;
  for(let i=1;i<pts.length;i++){
    const a=X(pts[i-1]),b=X(pts[i]),dx=b[0]-a[0],dy=b[1]-a[1],L2=dx*dx+dy*dy,seg=Math.sqrt(L2);
    const t=L2?clamp(-(a[0]*dx+a[1]*dy)/L2,0,1):0,dd=Math.hypot(a[0]+t*dx,a[1]+t*dy);
    if(dd<best){best=dd;along=acc+t*seg}acc+=seg;
  }
  return{d:best,along,total:acc};
}
/* punto a s metros del inicio, desplazado "off" metros hacia la izquierda */
function pointAt(pts,s,off){
  if(!pts.length)return null;if(pts.length===1)return pts[0].slice();
  let acc=0;
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i],L=dist(a,b);
    if(acc+L>=s||i===pts.length-1){
      const t=L?clamp((s-acc)/L,0,1):0,lat=a[0]+(b[0]-a[0])*t,lng=a[1]+(b[1]-a[1])*t;
      if(!off)return[lat,lng];
      const k=Math.cos(rad(lat)),dx=(b[1]-a[1])*111320*k,dy=(b[0]-a[0])*110574,n=Math.hypot(dx,dy)||1;
      return[lat+(dx/n)*off/110574,lng-(dy/n)*off/(111320*k)];
    }
    acc+=L;
  }
  return pts[pts.length-1].slice();
}
function decimate(pts,max){if(pts.length<=max)return pts;const out=[],step=(pts.length-1)/(max-1);for(let i=0;i<max;i++)out.push(pts[Math.round(i*step)]);return out}

/* ---------- modelo ---------- */
const state={list:[],currentId:null,tab:"mapa",mode:null,sel:null,day:1,base:"sat",speed:60,seg:[]};
function cur(){return state.list.find(o=>o.id===state.currentId)||null}
const carga=(op,id)=>op.cargas.find(c=>c.id===id)||null;
const camion=(op,id)=>op.camiones.find(c=>c.id===id)||null;
const viaje=(op,id)=>op.viajes.find(v=>v.id===id)||null;
function migrate(op){
  op.cargas=op.cargas||[];op.camiones=op.camiones||[];op.viajes=op.viajes||[];op.alertas=op.alertas||[];
  op.origen=op.origen||{nombre:""};op.destino=op.destino||{nombre:""};op.ruta=op.ruta||{pts:[],fuente:""};
  op.cfg=Object.assign({radio:300,tol:500,vel:30,parada:30},op.cfg||{});if(!op.dias)op.dias=TPL_DAYS;if(op.horaInicio==null)op.horaInicio="00:00";
  op.viajes.forEach(v=>{v.track=v.track||[]});
  return op;
}
function mapDayTpl(d,dias){return clamp(Math.round(d*dias/TPL_DAYS),1,dias)}
function tplCargas(dias){return CARGAS_TPL.map(r=>({id:uid(),nombre:r[0],cat:r[1],viajes:r[2],dia:mapDayTpl(r[3],dias)}))}
function newOp(f){
  return migrate({id:uid(),equipo:f.equipo,contratista:f.contratista,dtmId:f.dtmId||null,fechaInicio:f.fecha,horaInicio:f.hora||"00:00",dias:f.dias,
    origen:{nombre:f.origen},destino:{nombre:f.destino},ruta:{pts:[],fuente:""},cargas:f.tpl?tplCargas(f.dias):[],camiones:[],viajes:[],alertas:[],creado:Date.now(),actualizado:Date.now()});
}
const planTotal=op=>op.cargas.reduce((a,c)=>a+Math.max(0,Math.round(num(c.viajes))),0);
const byEstado=(op,e)=>op.viajes.filter(v=>v.estado===e);
function isStale(v){return v.estado==="transito"&&v.fuente!=="sim"&&v.pos&&Date.now()-v.pos.ts>STALE_MS}
function progress(op,v){
  if(v.estado==="llegado")return 1;if(v.estado!=="transito"||!v.pos)return 0;
  const n=nearest(path(op),[v.pos.lat,v.pos.lng]);return n&&n.total?clamp(n.along/n.total,0,1):0;
}
function remaining(op,v){const pt=path(op);if(pt.length<2||!v.pos)return null;const n=nearest(pt,[v.pos.lat,v.pos.lng]);return n?Math.max(0,n.total-n.along):null}
function vLabel(op,v){const c=carga(op,v.cargaId),k=camion(op,v.camionId);return (k&&k.patente||"Sin camión")+" · "+(c&&c.nombre||"Sin carga")}
function alerta(op,v,tipo,msg,ts){
  op.alertas.unshift({id:uid(),ts:ts||Date.now(),viajeId:v?v.id:null,tipo,msg});
  if(op.alertas.length>300)op.alertas.length=300;
  if(tipo==="desvio")toast("Desvío de ruta: "+vLabel(op,v)+". "+msg,true);
  else if(tipo==="parada")toast("Camión detenido: "+vLabel(op,v)+". "+msg,true);
  else if(tipo==="llegada"&&op.id===state.currentId)toast("Llegada: "+vLabel(op,v));
}
const lugar=p=>p&&p.nombre?p.nombre:"la locación";

/* procesa una posición nueva de un camión (simulador, GPS del celular, archivo o carga manual) */
function ingestPos(op,v,lat,lng,ts,fuente,eff){
  const p=[lat,lng];
  if(v.pos&&ts<v.pos.ts)return; /* posición vieja */
  const prev=v.pos;v.pos={lat,lng,ts};v.fuente=fuente;
  const tr=v.track,last=tr[tr.length-1];
  if(!last||dist(last,p)>120||ts-last[2]>120000)tr.push([+lat.toFixed(6),+lng.toFixed(6),ts]);
  if(tr.length>1500)tr.splice(0,tr.length-1500);
  const o=ll(op.origen),d=ll(op.destino),R=num(op.cfg.radio,300);
  if(v.estado==="programado"&&(!o||dist(o,p)>R)){v.estado="transito";v.salida=ts;alerta(op,v,"salida","Salió de "+lugar(op.origen),ts)}
  if(v.estado!=="transito")return;
  if(hasRoute(op)){
    const n=nearest(path(op),p),off=n&&n.d>num(op.cfg.tol,500);
    if(off&&!v.desviado){v.desviado=true;alerta(op,v,"desvio","Fuera de la ruta establecida a "+fmtM(n.d)+".",ts)}
    else if(!off&&v.desviado){v.desviado=false;alerta(op,v,"ruta","Volvió a la ruta establecida.",ts)}
  }
  if(d&&dist(d,p)<=R){v.estado="llegado";v.llegada=ts;v.sim=null;v.desviado=false;v.detenido=false;v.quieto=null;alerta(op,v,"llegada","Llegó a "+lugar(op.destino)+".",ts);return}
  /* detención prolongada: acumula el tiempo que el camión sigue dentro de 60 m del mismo punto, fuera de las locaciones */
  const q=v.quieto;
  if(q&&dist([q.lat,q.lng],p)<=60&&!(o&&dist(o,p)<=R)){
    q.ms+=eff!=null?eff:(prev?Math.max(0,ts-prev.ts):0);
    const lim=num(op.cfg.parada,30)*60000;
    if(q.ms>=lim&&!v.detenido){v.detenido=true;alerta(op,v,"parada","Detenido hace más de "+fmtDur(q.ms)+".",ts)}
  }else{
    if(v.detenido){v.detenido=false;alerta(op,v,"ruta","Reanudó la marcha"+(q?" tras "+fmtDur(q.ms):"")+".",ts)}
    v.quieto={lat,lng,ms:0};
  }
}
function startSim(op,v){
  if(path(op).length<2){toast("Marcá el origen y el destino en el mapa antes de simular.",true);return false}
  const o=path(op)[0];v.estado="transito";v.salida=Date.now();v.llegada=null;v.desviado=false;v.track=[];v.pos=null;
  v.sim={s:0,v:num(op.cfg.vel,30),off:0,offTarget:0,pausa:false};v.detenido=false;v.quieto=null;
  alerta(op,v,"salida","Salió de "+lugar(op.origen)+" (simulación).");
  ingestPos(op,v,o[0],o[1],Date.now(),"sim");return true;
}
let lastTick=Date.now();
function tick(){
  const now=Date.now(),dt=Math.min(5,(now-lastTick)/1000);lastTick=now;
  let any=false;
  state.list.forEach(op=>{
    const pt=path(op);if(pt.length<2)return;const total=lenOf(pt);
    op.viajes.forEach(v=>{
      if(v.estado!=="transito"||!v.sim)return;any=true;
      const s=v.sim;if(!s.pausa)s.s=Math.min(total,s.s+s.v/3.6*dt*state.speed);
      s.off+=clamp(s.offTarget-s.off,-60*dt*state.speed/10,60*dt*state.speed/10);
      const p=s.s>=total?pt[pt.length-1]:pointAt(pt,s.s,s.off);
      ingestPos(op,v,p[0],p[1],now,"sim",dt*1000*state.speed);
      if(s.s>=total&&v.estado==="transito"){v.estado="llegado";v.llegada=now;v.sim=null;alerta(op,v,"llegada","Llegó a "+lugar(op.destino)+".",now)}
    });
    if(any)touch(op,true);
  });
  if(cur()){drawLive();renderLive();if(any&&state.tab!=="mapa")refreshKpis()}
}

/* ---------- persistencia: base compartida (si existe) + copia local ---------- */
let col=null,dbMode="local",saveTimer=null,saveAt=0,flushing=false,firstSnap=true;
const dirty=new Set(),deleted=new Set();
function loadLocal(){try{const v=JSON.parse(localStorage.getItem(LS_KEY));return Array.isArray(v)?v:[]}catch(e){return[]}}
function saveLocal(){try{localStorage.setItem(LS_KEY,JSON.stringify(state.list))}catch(e){}}
function setSync(s,msg){const el=$("#sync");if(!el)return;el.dataset.s=s;el.querySelector("span").textContent=msg}
function syncIdle(){if(dbMode==="db")setSync("ok","Guardado");else setSync("idle","Guardado en este navegador")}
function touch(op,lazy){
  op.actualizado=Date.now();dirty.add(op.id);
  const at=Date.now()+(lazy?5000:400);if(saveTimer&&saveAt<=at)return;
  clearTimeout(saveTimer);saveAt=at;saveTimer=setTimeout(persist,at-Date.now());
  if(!lazy&&dbMode==="db")setSync("pending","Guardando…");
}
function persist(){saveTimer=null;saveLocal();writeLink();flush()}
async function flush(){
  if(!col){dirty.clear();deleted.clear();syncIdle();return}
  if(flushing){saveTimer=setTimeout(persist,500);return}
  flushing=true;const ids=[...dirty],dels=[...deleted];dirty.clear();deleted.clear();
  try{
    for(const id of dels)await col.doc(id).delete();
    for(const id of ids){const o=state.list.find(x=>x.id===id);if(o)await col.doc(id).set(JSON.parse(JSON.stringify(o)))}
    syncIdle();
  }catch(e){ids.forEach(i=>dirty.add(i));dels.forEach(i=>deleted.add(i));setSync("err","No se pudo guardar, reintentando");saveTimer=setTimeout(persist,4000)}
  flushing=false;
}
async function connectDb(){
  if(!window.claude||typeof window.claude.use!=="function"){syncIdle();return}
  let db=null;try{db=await window.claude.use("db")}catch(e){db=null}
  if(!db){syncIdle();return}
  dbMode="db";col=db.collection("traslados");
  col.onSnapshot(snap=>{
    if(firstSnap&&snap.metadata.fromCache&&snap.empty)return;
    if(firstSnap){firstSnap=false;if(snap.empty&&state.list.length){state.list.forEach(o=>dirty.add(o.id));setTimeout(persist,1000);return}}
    if(dirty.size||deleted.size||flushing||snap.metadata.hasPendingWrites)return;
    state.list=snap.docs.map(d=>d.data()).filter(Boolean).map(x=>migrate(JSON.parse(JSON.stringify(x)))).sort((a,b)=>(a.creado||0)-(b.creado||0));
    if(!cur())state.currentId=state.list.length?state.list[state.list.length-1].id:null;
    saveLocal();writeLink();if(!isEditing())render();syncIdle();
  },()=>{col=null;dbMode="local";setSync("err","Sin conexión a la base; se guarda en este navegador")});
}
function isEditing(){const a=document.activeElement;return a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&!a.closest("dialog")&&document.body.contains(a)}

/* ---------- vínculo con Seguimiento DTM ---------- */
function loadSeg(){try{const v=JSON.parse(localStorage.getItem(SEG_KEY));return Array.isArray(v)?v:[]}catch(e){return[]}}
function segFor(op){return state.seg.find(d=>op.dtmId&&d.id===op.dtmId)||state.seg.find(d=>sameRig(d.equipo,op.equipo)&&d.fechaInicio===op.fechaInicio)||null}
function segDays(d){let m=d.dias||1;(d.tareas||[]).forEach(t=>{m=Math.max(m,t.dia||1)});return m}
/* trae fecha, hora y días del DTM vinculado para que los días de plan coincidan */
function syncFromSeg(){
  state.seg=loadSeg();
  state.list.forEach(op=>{const d=segFor(op);if(!d)return;
    const ch={dtmId:d.id,fechaInicio:d.fechaInicio,horaInicio:d.horaInicio||"00:00",dias:segDays(d)};
    if(Object.keys(ch).some(k=>op[k]!==ch[k])){Object.assign(op,ch);touch(op)}});
}
function linkPkg(ops){
  return{tipo:"rastreo-dtm-viajes",version:1,exportado:Date.now(),
    operaciones:ops.map(op=>{
      const plan={};op.cargas.forEach(c=>{const n=Math.max(0,Math.round(num(c.viajes)));if(n)plan[c.dia||1]=(plan[c.dia||1]||0)+n});
      return{id:op.id,dtmId:op.dtmId||null,equipo:op.equipo,fechaInicio:op.fechaInicio,horaInicio:op.horaInicio,dias:op.dias,
        origen:op.origen.nombre||"",destino:op.destino.nombre||"",kmRuta:path(op).length>1?Math.round(lenOf(path(op))/100)/10:null,
        viajesPlan:planTotal(op),planPorDia:plan,
        viajes:op.viajes.filter(v=>v.estado!=="programado").map(v=>{const c=carga(op,v.cargaId)||{},k=camion(op,v.camionId)||{};
          return{id:v.id,carga:c.nombre||"",categoria:c.cat||"",patente:k.patente||"",transportista:k.transportista||"",chofer:k.chofer||"",estado:v.estado,salida:v.salida||null,llegada:v.llegada||null,desvios:op.alertas.filter(a=>a.viajeId===v.id&&a.tipo==="desvio").length,detenciones:op.alertas.filter(a=>a.viajeId===v.id&&a.tipo==="parada").length}})};
    })};
}
function writeLink(){try{localStorage.setItem(LINK_KEY,JSON.stringify(linkPkg(state.list)))}catch(e){}}
/* en claude.ai la descarga pasa por la capacidad "downloads"; fuera de ahí, enlace directo */
async function download(name,text,type){
  let dl=null;try{dl=window.claude&&typeof window.claude.use==="function"?await window.claude.use("downloads"):null}catch(e){dl=null}
  if(dl){try{await dl.save({filename:name,data:text});return true}catch(e){if(e&&e.code==="declined")return false;throw e}}
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);return true;
}
function exportLink(op){

  download(name,JSON.stringify(linkPkg([op]),null,1),"application/json").then(ok=>{if(ok)toast("Archivo de viajes descargado. Importalo desde Seguimiento DTM con el botón «Importar viajes».")},()=>toast("No se pudo generar la descarga en esta vista.",true));
}
function exportCsv(op){
  const q=v=>{const s=String(v==null?"":v);return /[";\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
  const L=[["Equipo","Origen","Destino","Carga","Categoría","Patente","Transportista","Chofer","Estado","Salida","Llegada","Duración","Día de plan (llegada)","Fuente","Desvíos"].join(";")];
  op.viajes.forEach(v=>{const c=carga(op,v.cargaId)||{},k=camion(op,v.camionId)||{};
    L.push([op.equipo,op.origen.nombre,op.destino.nombre,c.nombre,c.cat,k.patente,k.transportista,k.chofer,ESTADOS[v.estado].t,fmtDT(v.salida),fmtDT(v.llegada),v.salida&&v.llegada?fmtDur(v.llegada-v.salida):"",v.llegada?dayOf(op,v.llegada):"",FUENTES[v.fuente]||"",op.alertas.filter(a=>a.viajeId===v.id&&a.tipo==="desvio").length].map(q).join(";"))});
  download("Viajes_"+(op.equipo||"equipo").replace(/[^\w\-]+/g,"_")+"_"+isoToday()+".csv","﻿"+L.join("\n"),"text/csv").catch(()=>toast("No se pudo generar la descarga en esta vista.",true));

/* ---------- archivos: ruta (KML / GPX / GeoJSON) y posiciones (CSV) ---------- */
/* lee un KMZ (zip) y devuelve el texto del KML que contiene */
async function unzipKml(buf){
  const u=new Uint8Array(buf),dv=new DataView(buf);let e=-1;
  for(let i=u.length-22;i>=Math.max(0,u.length-65557);i--)if(dv.getUint32(i,true)===0x06054b50){e=i;break}
  if(e<0)throw new Error("El KMZ no es un archivo comprimido válido.");
  const n=dv.getUint16(e+10,true),ents=[];let p=dv.getUint32(e+16,true);
  for(let k=0;k<n&&p+46<=u.length;k++){
    if(dv.getUint32(p,true)!==0x02014b50)break;
    const fnl=dv.getUint16(p+28,true);
    ents.push({name:new TextDecoder().decode(u.subarray(p+46,p+46+fnl)),meth:dv.getUint16(p+10,true),csz:dv.getUint32(p+20,true),off:dv.getUint32(p+42,true)});
    p+=46+fnl+dv.getUint16(p+30,true)+dv.getUint16(p+32,true);
  }
  const ent=ents.find(x=>/(^|\/)doc\.kml$/i.test(x.name))||ents.find(x=>/\.kml$/i.test(x.name));
  if(!ent)throw new Error("El KMZ no contiene ningún KML.");
  const lo=ent.off,ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true),data=u.subarray(ds,ds+ent.csz);
  if(ent.meth===0)return new TextDecoder().decode(data);
  if(ent.meth!==8||typeof DecompressionStream==="undefined")throw new Error("Este navegador no puede abrir el KMZ: guardalo como KML desde Google Earth.");
  return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).text();
}
async function readGeoFile(f){
  const buf=await f.arrayBuffer(),u=new Uint8Array(buf);
  if(u[0]===0x50&&u[1]===0x4b)return unzipKml(buf);
  return new TextDecoder().decode(u);
}
/* devuelve las líneas de recorrido y los puntos con nombre (locaciones) de un KML, GPX o GeoJSON */
function parseGeo(name,text){
  let pts=[];const places=[],low=name.toLowerCase();
  const okP=p=>isFinite(p[0])&&isFinite(p[1])&&Math.abs(p[0])<=90&&Math.abs(p[1])<=180&&!(p[0]===0&&p[1]===0);
  const addPlace=(nm,lat,lng)=>{if(okP([lat,lng]))places.push({nombre:String(nm||"").trim(),lat:+lat,lng:+lng})};
  if(/\.(geo)?json$/.test(low)||/^\s*[{[]/.test(text)){
    const walk=(g,nm)=>{if(!g)return;const t=g.type;
      if(t==="FeatureCollection")g.features.forEach(f=>walk(f));else if(t==="Feature")walk(g.geometry,g.properties&&(g.properties.name||g.properties.nombre));else if(t==="GeometryCollection")g.geometries.forEach(x=>walk(x,nm));
      else if(t==="LineString")g.coordinates.forEach(c=>pts.push([c[1],c[0]]));else if(t==="MultiLineString")g.coordinates.forEach(l=>l.forEach(c=>pts.push([c[1],c[0]])));
      else if(t==="Point")addPlace(nm,g.coordinates[1],g.coordinates[0])};
    walk(JSON.parse(text));
  }else{
    const x=new DOMParser().parseFromString(text,"application/xml");
    if(x.getElementsByTagName("parsererror").length)throw new Error("El archivo no es un KML, KMZ o GPX válido.");
    const tx=(el,tag)=>{const n=el.getElementsByTagName(tag)[0];return n?n.textContent:""};
    if(x.getElementsByTagName("gpx").length){
      let ns=[...x.getElementsByTagName("trkpt")];if(!ns.length)ns=[...x.getElementsByTagName("rtept")];

  if(m){const lat=num(m[1],NaN),lng=num(m[2],NaN);if(Math.abs(lat)<=90&&Math.abs(lng)<=180)return{lat:+lat.toFixed(6),lng:+lng.toFixed(6)}}

    const a=dms.find(d=>/[NS]/i.test(d[4])),b=dms.find(d=>/[EWO]/i.test(d[4]));if(a&&b)return{lat:+v(a).toFixed(6),lng:+v(b).toFixed(6)}}

  const sep=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?";":(lines[0].includes("\t")?"\t":",");
  const H=splitCsv(lines[0],sep).map(h=>h.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""));

function diasHtml(op){
  const N=op.dias,today=curDay(op);
  if(state.dayOp!==op.id){state.dayOp=op.id;state.day=today>=1&&today<=N?today:1}
  const D=clamp(state.day,1,N);state.day=D;
  const planD=i=>op.cargas.filter(c=>(c.dia||1)===i).reduce((a,c)=>a+Math.max(0,Math.round(num(c.viajes))),0);
  const realD=i=>op.viajes.filter(v=>v.estado==="llegado"&&dayOf(op,v.llegada)===i);
  let s='';
  for(let i=1;i<=N;i++){
    const p=planD(i),r=realD(i).length,pct=p?Math.min(100,r/p*100):(r?100:0),dt=dayDate(op,i);
    s+='<button class="day'+(today===i?" today":"")+(p||r?"":" off")+'" data-act="day" data-dia="'+i+'" aria-pressed="'+(i===D)+'"><div class="tank"><div class="fill" style="height:'+pct.toFixed(1)+'%"></div><div class="pct">'+r+(p?'/'+p:'')+'</div></div>'+
      '<div class="meta"><strong>Día '+i+'</strong><span>'+esc(fmtDay(dt))+(today===i?", en curso":"")+'</span><br><span>'+(p||r?plural(r,"viaje realizado","viajes realizados"):"Sin viajes de plan")+'</span></div></button>';
  }
  const before=op.viajes.filter(v=>v.estado==="llegado"&&dayOf(op,v.llegada)<1).length,after=op.viajes.filter(v=>v.estado==="llegado"&&dayOf(op,v.llegada)>N).length;
  let h='<div class="strip">'+s+'</div>';
  if(before||after)h+='<p class="hint">'+(before?plural(before,"viaje llegó","viajes llegaron")+' antes del día 1. ':'')+(after?plural(after,"viaje llegó","viajes llegaron")+' después del último día de plan.':'')+'</p>';
  const list=realD(D),tr=op.viajes.filter(v=>v.estado==="transito"&&dayOf(op,v.salida)<=D);
  const pend=op.cargas.filter(c=>(c.dia||1)===D).map(c=>{const ok=op.viajes.filter(v=>v.cargaId===c.id&&v.estado==="llegado").length;return{c,falta:Math.max(0,Math.round(num(c.viajes))-ok)}}).filter(x=>x.falta);
  h+='<div class="two"><section class="panel"><div class="sec-h"><h3 class="h3">Día '+D+'</h3><span class="sub">'+esc(fmtDT(dayDate(op,D)))+' a '+esc(fmtDT(dayDate(op,D+1)))+'. Cuenta cada viaje en el día de su llegada.</span></div>';
  if(!list.length)h+='<p class="empty">No hay viajes realizados en este día.</p>';
  else h+='<div class="tw"><table class="rt"><thead><tr><th>Carga</th><th>Camión</th><th>Salida</th><th>Llegada</th><th class="num">Duración</th></tr></thead><tbody>'+
    list.sort((a,b)=>a.llegada-b.llegada).map(v=>{const c=carga(op,v.cargaId)||{},k=camion(op,v.camionId)||{};return '<tr><td>'+esc(c.nombre||"")+'</td><td>'+esc(k.patente||"")+'</td><td>'+esc(fmtDT(v.salida))+'</td><td>'+esc(fmtDT(v.llegada))+'</td><td class="num">'+fmtDur(v.llegada-v.salida)+'</td></tr>'}).join("")+'</tbody></table></div>';
  if(D===today&&tr.length)h+='<p class="mut" style="margin-top:10px">Además hay '+plural(tr.length,"camión","camiones")+' en tránsito ahora.</p>';
  if(pend.length)h+='<h3 class="h3" style="margin-top:18px">Cargas de plan pendientes del día</h3><ul style="margin:0;padding-left:18px">'+pend.map(x=>'<li>'+esc(x.c.nombre)+': faltan '+plural(x.falta,"viaje","viajes")+'</li>').join("")+'</ul>';
  h+='</section><section class="panel"><h3 class="h3">Vínculo con Seguimiento DTM</h3><div class="linkbox">';
  const seg=segFor(op);
  h+=seg?'<p><b>Vinculado</b> con el DTM <b>'+esc(seg.equipo)+'</b> que empieza el '+esc(fmtDay(dayDate(seg,1)))+'. Los días de plan se toman de ese DTM y Seguimiento DTM muestra los viajes en cada día al abrirse en este mismo navegador.</p>'
    :'<p>No se encontró en este navegador un DTM de Seguimiento DTM con el mismo equipo y la misma fecha de inicio. Descargá el archivo de viajes e importalo desde Seguimiento DTM con el botón <b>Importar viajes</b>.</p>';
  h+='<div class="btnrow"><button class="btn primary" data-act="link">Descargar archivo de viajes</button></div><p class="mut" style="margin:10px 0 0">El archivo incluye los viajes en tránsito y los realizados, con carga, patente, salida y llegada, más los viajes de plan por día.</p></div></section></div>';
  return h;
}

/* ---------- confirmación ---------- */
function askConfirm(title,msg,ok){
  const d=$("#cfm");$("#cfmTitle").textContent=title;$("#cfmMsg").textContent=msg;$("#cfmYes").textContent=ok||"Aceptar";
  return new Promise(res=>{const done=v=>{d.close();$("#cfmYes").onclick=$("#cfmNo").onclick=null;res(v)};$("#cfmYes").onclick=()=>done(true);$("#cfmNo").onclick=()=>done(false);d.showModal()});
}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]");if(!b||b.closest("dialog")||b.tagName==="SELECT"||b.tagName==="INPUT")return;
  const act=b.dataset.act,op=cur(),id=b.dataset.id,v=op&&id?viaje(op,id):null;
  if(act==="new"){openDlg(null);return}
  if(act==="demo"){loadDemo();return}
  if(!op)return;
  if(act==="edit")openDlg(op);
  else if(act==="tab"){state.tab=b.dataset.tab;if(state.mode&&state.tab!=="mapa")state.mode=null;render()}
  else if(act==="mode")setMode(state.mode===b.dataset.mode?null:b.dataset.mode);
  else if(act==="mode-off"){const was=state.mode;setMode(null);if(was==="ruta"&&hasRoute(op))toast("Ruta guardada: "+fmtKm(lenOf(op.ruta.pts))+".")}
  else if(act==="ruta-undo"){op.ruta.pts.pop();touch(op);drawStatic();renderModeBar();renderSide()}
  else if(act==="ruta-file"){state.fileTarget="ruta";$("#fileRoute").click()}
  else if(act==="loc-file"){state.fileTarget=b.dataset.target;$("#fileRoute").click()}
  else if(act==="ruta-clear")askConfirm("Borrar ruta","¿Borrar la ruta establecida? Los viajes van a controlarse contra la línea recta entre origen y destino.","Borrar ruta").then(ok=>{if(ok){op.ruta={pts:[],fuente:""};touch(op);drawStatic();renderSide();refreshKpis()}});
  else if(act==="sel")selectTrip(id,false);
  else if(act==="ver")selectTrip(id,true);
  else if(act==="sim-pausa"&&v&&v.sim){v.sim.pausa=!v.sim.pausa;renderLive()}
  else if(act==="sim-desvio"&&v&&v.sim){v.sim.offTarget=v.sim.offTarget?0:Math.max(800,num(op.cfg.tol,500)*1.8);renderLive()}
  else if(act==="tpl"){op.cargas=tplCargas(op.dias);touch(op);render()}
  else if(act==="add-carga"){op.cargas.push({id:uid(),nombre:"",cat:"Varios",viajes:1,dia:clamp(curDay(op)||1,1,op.dias)});touch(op);render();const i=document.querySelectorAll('[data-c="nombre"]');if(i.length)i[i.length-1].focus()}
  else if(act==="add-camion"){op.camiones.push({id:uid(),patente:"",transportista:"",chofer:""});touch(op);render();const i=document.querySelectorAll('[data-k="patente"]');if(i.length)i[i.length-1].focus()}
  else if(act==="del-carga"){const c=carga(op,id),n=op.viajes.filter(x=>x.cargaId===id).length;askConfirm("Eliminar carga","¿Eliminar «"+(c.nombre||"sin nombre")+"»?"+(n?" Tiene "+plural(n,"viaje","viajes")+" que quedan sin carga asignada.":""),"Eliminar").then(ok=>{if(ok){op.cargas=op.cargas.filter(x=>x.id!==id);touch(op);render()}})}
  else if(act==="del-camion"){const k=camion(op,id);askConfirm("Eliminar camión","¿Eliminar el camión "+(k.patente||"sin patente")+"?","Eliminar").then(ok=>{if(ok){op.camiones=op.camiones.filter(x=>x.id!==id);touch(op);render()}})}
  else if(act==="add-viaje"){
    if(!op.cargas.length||!op.camiones.length){toast("Primero cargá al menos una carga y un camión.",true);return}
    const c=op.cargas.find(c=>op.viajes.filter(x=>x.cargaId===c.id).length<Math.round(num(c.viajes)))||op.cargas[0];
    const busy=new Set(op.viajes.filter(x=>x.estado!=="llegado").map(x=>x.camionId)),k=op.camiones.find(k=>!busy.has(k.id))||op.camiones[0];
    op.viajes.push({id:uid(),cargaId:c.id,camionId:k.id,estado:"programado",salida:null,llegada:null,track:[],creado:Date.now()});touch(op);render();
  }
  else if(act==="del-viaje"&&v)askConfirm("Eliminar viaje","¿Eliminar el viaje "+vLabel(op,v)+"?","Eliminar").then(ok=>{if(ok){if(gps&&gps.v===id)gpsStop();op.viajes=op.viajes.filter(x=>x.id!==id);op.alertas=op.alertas.filter(a=>a.viajeId!==id);if(state.sel===id)state.sel=null;touch(op);render()}});
  else if(act==="sim"&&v){if(startSim(op,v)){state.sel=v.id;touch(op);state.tab="mapa";render();fitAll()}}
  else if(act==="salida"&&v){const o=ll(op.origen);v.estado="transito";v.salida=Date.now();v.fuente="manual";if(o)v.pos={lat:o[0],lng:o[1],ts:Date.now()};alerta(op,v,"salida","Salió de "+lugar(op.origen)+" (registro manual).");touch(op);render()}
  else if(act==="llegada"&&v){const d=ll(op.destino);v.sim=null;if(gps&&gps.v===id)gpsStop();v.estado="llegado";v.llegada=Date.now();v.desviado=false;if(d){v.pos={lat:d[0],lng:d[1],ts:Date.now()};v.track.push([d[0],d[1],Date.now()])}alerta(op,v,"llegada","Llegó a "+lugar(op.destino)+" (registro manual).");touch(op);render()}
  else if(act==="pos"&&v)setMode("pos:"+v.id);
  else if(act==="gps"&&v){gpsStart(op,v);render()}
  else if(act==="gps-off"){gpsStop();render()}
  else if(act==="csv-pos")$("#fileCsv").click();
  else if(act==="csv")exportCsv(op);
  else if(act==="link")exportLink(op);
  else if(act==="day"){state.day=+b.dataset.dia;render()}
});
document.addEventListener("change",e=>{
  const el=e.target,op=cur();if(!op||el.closest("dialog"))return;
  if(el.dataset.act==="pick"){gpsStop();state.currentId=el.value;state.sel=null;state.mode=null;state.fitNext=true;render();return}
  if(el.dataset.act==="speed"){state.speed=+el.value;return}
  if(el.dataset.coord){const k=el.dataset.coord;try{const p=parseLoc(el.value);if(!p)return;op[k]=Object.assign({},op[k],p);touch(op);drawStatic();if(map)map.setView([p.lat,p.lng],Math.max(map.getZoom(),14));renderSide();toast((k==="origen"?"Origen":"Destino")+" ubicado en "+fmtLL(p)+".")}catch(err){toast(err.message,true)}return}
  if(el.dataset.cfg){op.cfg[el.dataset.cfg]=Math.max(1,num(el.value,op.cfg[el.dataset.cfg]));touch(op);drawStatic();return}
  if(el.dataset.c){const c=carga(op,el.dataset.id);if(!c)return;const f=el.dataset.c;c[f]=f==="viajes"?clamp(Math.round(num(el.value)),0,99):f==="dia"?+el.value:el.value;touch(op);if(f!=="nombre")render();return}
  if(el.dataset.k){const k=camion(op,el.dataset.id);if(k){k[el.dataset.k]=el.dataset.k==="patente"?el.value.toUpperCase().replace(/[^A-Z0-9]/g,""):el.value;touch(op);drawLive()}return}
  if(el.dataset.v){const v=viaje(op,el.dataset.id);if(!v)return;const f=el.dataset.v;
    if(f==="salida"){const t=fromLocalInput(el.value);v.salida=t;if(!t){v.estado="programado";v.llegada=null;v.sim=null}else if(v.estado==="programado"){v.estado="transito";v.fuente=v.fuente||"manual"}}
    else if(f==="llegada"){const t=fromLocalInput(el.value);if(t&&v.salida&&t<v.salida){toast("La llegada no puede ser anterior a la salida.",true);render();return}v.llegada=t;v.estado=t?"llegado":(v.salida?"transito":"programado");if(t){v.sim=null;v.desviado=false}}
    else v[f]=el.value||null;
    touch(op);render();return}
});
document.addEventListener("input",e=>{
  const el=e.target,op=cur();if(!op)return;
  if(el.dataset.pt){op[el.dataset.pt].nombre=el.value;touch(op)}
});
document.addEventListener("focusout",e=>{if(e.target.dataset&&e.target.dataset.pt)setTimeout(()=>{if(!isEditing())render()},0)});
$("#baseBtn").addEventListener("click",()=>setBase(state.base==="sat"?"osm":"sat"));
$("#fitBtn").addEventListener("click",fitAll);
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&state.mode&&!document.querySelector("dialog[open]"))setMode(null)});
$("#fileRoute").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";const op=cur(),tg=state.fileTarget||"ruta";if(!f||!op)return;
  try{
    const g=parseGeo(f.name,await readGeoFile(f));
    if(tg==="ruta"){
      if(g.line.length<2)throw new Error("No se encontró ninguna línea de recorrido en el archivo."+(g.places.length?" Tiene puntos: usá el botón KML / KMZ del origen o del destino.":""));
      const ub=[];["origen","destino"].forEach(k=>{if(!ll(op[k])){const pl=matchPlace(g.places,op[k].nombre);if(pl){op[k]=Object.assign({},op[k],{lat:pl.lat,lng:pl.lng});ub.push(k)}}});
      const auto=applyRoute(op,g.line,"Archivo "+f.name);
      touch(op);drawStatic();fitAll();renderSide();refreshKpis();
      toast("Ruta importada: "+fmtKm(lenOf(op.ruta.pts))+", "+plural(op.ruta.pts.length,"punto","puntos")+"."+(ub.length?" Se ubicó el "+ub.join(" y el ")+" con los puntos del archivo.":"")+(auto.length?" Se ubicó el "+auto.join(" y el ")+" en los extremos de la ruta.":""));
    }else{
      let pl=matchPlace(g.places,op[tg].nombre)||(g.places.length?g.places[0]:null),note="";
      if(!pl&&g.line.length){const p=tg==="origen"?g.line[0]:g.line[g.line.length-1];pl={nombre:"",lat:p[0],lng:p[1]};note=" (extremo de la línea del archivo)"}
      if(!pl)throw new Error("El archivo no tiene puntos ni líneas.");
      if(g.places.length>1&&!matchPlace(g.places,op[tg].nombre))note=" Se tomó el primer punto del archivo («"+(pl.nombre||"sin nombre")+"»); para elegir otro, poné su nombre en el campo y volvé a importar.";
      op[tg]=Object.assign({},op[tg],{lat:+pl.lat.toFixed(6),lng:+pl.lng.toFixed(6)});if(!op[tg].nombre&&pl.nombre)op[tg].nombre=pl.nombre;
      touch(op);drawStatic();fitAll();renderSide();
      toast((tg==="origen"?"Origen":"Destino")+" ubicado"+(pl.nombre?" en «"+pl.nombre+"»":"")+"."+note);
    }
  }catch(err){toast(err.message||"No se pudo leer el archivo.",true)}
});
$("#fileCsv").addEventListener("change",async e=>{
  const f=e.target.files[0];e.target.value="";const op=cur();if(!f||!op)return;
  try{const r=importCsv(op,await f.text());touch(op);render();
    toast(plural(r.ok,"posición importada","posiciones importadas")+" en "+plural(r.viajes,"viaje","viajes")+"."+(r.sin.length?" Patentes sin camión cargado: "+r.sin.slice(0,4).join(", ")+(r.sin.length>4?"…":"")+".":""),!r.ok)}
  catch(err){toast(err.message||"No se pudo leer el archivo.",true)}
});

/* diálogo nuevo / editar */
const dlg=$("#dlg"),form=$("#dlgForm");let editing=null;
function openDlg(op){
  editing=op;state.seg=loadSeg();const F=form.elements;
  $("#dlgTitle").textContent=op?"Editar traslado":"Nuevo traslado";$("#dlgOk").textContent=op?"Guardar":"Crear traslado";$("#dlgDelete").hidden=!op;$("#tplRow").hidden=!!op;$("#dlgErr").hidden=true;
  const segs=state.seg.slice().sort((a,b)=>String(b.fechaInicio).localeCompare(String(a.fechaInicio)));
  $("#segRow").hidden=!segs.length;
  F.dtm.innerHTML='<option value="">Sin vincular (cargar los datos a mano)</option>'+segs.map(d=>'<option value="'+esc(d.id)+'">'+esc(d.equipo||"Sin nombre")+', '+esc(fmtDay(dayDate(d,1)))+(d.destino?" a "+esc(d.destino):"")+'</option>').join("");
  F.dtm.value=op&&op.dtmId&&segs.some(d=>d.id===op.dtmId)?op.dtmId:"";
  F.equipo.value=op?op.equipo:"";F.contratista.value=op?(op.contratista||""):"DLS";F.origen.value=op?op.origen.nombre||"":"";F.destino.value=op?op.destino.nombre||"":"";
  F.fecha.value=op?op.fechaInicio:isoToday();F.hora.value=op?op.horaInicio||"00:00":"00:00";F.dias.value=op?op.dias:TPL_DAYS;F.tpl.checked=true;
  lockSeg();dlg.showModal();
}
function lockSeg(){const F=form.elements,d=state.seg.find(x=>x.id===F.dtm.value);[F.fecha,F.hora,F.dias].forEach(i=>i.readOnly=!!d);
  if(d){F.equipo.value=d.equipo||"";F.contratista.value=d.contratista||F.contratista.value;if(d.origen)F.origen.value=d.origen;if(d.destino)F.destino.value=d.destino;F.fecha.value=d.fechaInicio||"";F.hora.value=d.horaInicio||"00:00";F.dias.value=segDays(d)}}
form.elements.dtm.addEventListener("change",lockSeg);
$("#dlgCancel").addEventListener("click",()=>dlg.close());
$("#dlgDelete").addEventListener("click",()=>{const op=editing;dlg.close();
  askConfirm("Eliminar traslado","¿Eliminar el traslado de "+(op.equipo||"sin nombre")+" con todas sus cargas, camiones y viajes? No se puede deshacer.","Eliminar traslado").then(ok=>{if(!ok)return;
    gpsStop();state.list=state.list.filter(x=>x.id!==op.id);dirty.delete(op.id);deleted.add(op.id);state.currentId=state.list.length?state.list[state.list.length-1].id:null;state.sel=null;state.mode=null;persist();state.fitNext=true;render()})});
form.addEventListener("submit",e=>{
  e.preventDefault();const F=form.elements;
  const f={dtmId:F.dtm.value||null,equipo:F.equipo.value.trim(),contratista:F.contratista.value.trim(),origen:F.origen.value.trim(),destino:F.destino.value.trim(),fecha:F.fecha.value,hora:F.hora.value||"00:00",dias:clamp(Math.round(num(F.dias.value,8)),1,60),tpl:F.tpl.checked};
  const err=m=>{$("#dlgErr").textContent=m;$("#dlgErr").hidden=false};
  if(!f.equipo)return err("Indicá el equipo.");if(!f.fecha)return err("Indicá la fecha de inicio del DTM.");
  if(editing){const op=editing;Object.assign(op,{dtmId:f.dtmId,equipo:f.equipo,contratista:f.contratista,fechaInicio:f.fecha,horaInicio:f.hora,dias:f.dias});op.origen.nombre=f.origen;op.destino.nombre=f.destino;
    op.cargas.forEach(c=>{c.dia=clamp(c.dia||1,1,f.dias)});touch(op)}
  else{const op=newOp(f);state.list.push(op);state.currentId=op.id;state.tab="mapa";state.sel=null;touch(op);state.fitNext=true;
    setTimeout(()=>toast("Traslado creado. Ubicá el origen y el destino en el mapa y cargá la ruta de la compañía de torre."),300)}
  dlg.close();render();
});

/* ---------- ejemplo para probar el prototipo ---------- */
function loadDemo(){
  const t=new Date();t.setDate(t.getDate()-3);
  const f={equipo:"Equipo de ejemplo 01",contratista:"DLS",origen:"Locación A (ejemplo)",destino:"Locación B (ejemplo)",fecha:t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate()),hora:"07:00",dias:8,tpl:true};
  const op=newOp(f);
  op.origen=Object.assign(op.origen,{lat:-38.2885,lng:-68.9862});op.destino=Object.assign(op.destino,{lat:-38.3962,lng:-68.8325});
  op.ruta={fuente:"Ejemplo",pts:[[-38.2902,-68.9801],[-38.2981,-68.9744],[-38.3072,-68.9703],[-38.3189,-68.9551],[-38.3304,-68.9396],[-38.3371,-68.9187],[-38.3459,-68.9003],[-38.3577,-68.8842],[-38.3712,-68.8701],[-38.3835,-68.8538],[-38.3921,-68.8411]]};
  op.camiones=[["AB123CD","Transportes del Sur","J. Gómez"],["AC456EF","Transportes del Sur","R. Díaz"],["AD789GH","Logística Neuquén","M. Sosa"],["AE012IJ","Logística Neuquén","P. Ruiz"],["AF345KL","Grúas Patagonia","L. Vera"]].map(r=>({id:uid(),patente:r[0],transportista:r[1],chofer:r[2]}));
  const pt=path(op),total=lenOf(pt),d1=dayDate(op,1).getTime(),C=op.cargas;
  const done=(ci,ki,dia,hs)=>{const s=d1+(dia-1)*DAY_MS+hs*3600e3,dur=(total/1000/28)*3600e3+Math.random()*20*60000,v={id:uid(),cargaId:C[ci].id,camionId:op.camiones[ki].id,estado:"llegado",salida:s,llegada:s+dur,fuente:"csv",track:[],creado:s};
    for(let k=0;k<=12;k++){const p=pointAt(pt,total*k/12);v.track.push([p[0],p[1],s+dur*k/12])}const e=pt[pt.length-1];v.pos={lat:e[0],lng:e[1],ts:v.llegada};op.viajes.push(v);
    op.alertas.unshift({id:uid(),ts:s,viajeId:v.id,tipo:"salida",msg:"Salió de "+op.origen.nombre},{id:uid(),ts:v.llegada,viajeId:v.id,tipo:"llegada",msg:"Llegó a "+op.destino.nombre+"."})};
  const gi=C.findIndex(c=>c.nombre==="Generadores"),vi=C.findIndex(c=>/^VFD/.test(c.nombre)),pi=C.findIndex(c=>/^Piletas/.test(c.nombre)),ti=C.findIndex(c=>/^Tanque de gasoil/.test(c.nombre));
  done(gi,0,4,1.5);done(gi,1,4,2);done(vi,2,4,3.2);done(pi,3,4,4.1);done(ti,4,4,5);done(gi,0,4,6.5);
  op.alertas.sort((a,b)=>b.ts-a.ts);
  const live=(ci,ki,frac)=>{const v={id:uid(),cargaId:C[ci].id,camionId:op.camiones[ki].id,estado:"programado",salida:null,llegada:null,track:[],creado:Date.now()};op.viajes.push(v);startSim(op,v);v.sim.s=total*frac;return v};
  live(pi,1,.15);live(pi,2,.55);const fi=C.findIndex(c=>/^Festoon/.test(c.nombre));live(fi,3,.35);
  [[pi,4],[C.findIndex(c=>/^Silos/.test(c.nombre)),0]].forEach(([ci,ki])=>op.viajes.push({id:uid(),cargaId:C[ci].id,camionId:op.camiones[ki].id,estado:"programado",salida:null,llegada:null,track:[],creado:Date.now()}));
  state.list.push(op);state.currentId=op.id;state.tab="mapa";state.speed=60;state.fitNext=true;touch(op);render();
  toast("Ejemplo cargado: tres camiones circulan simulados a velocidad x60. Probá «Simular desvío» en uno de ellos.");
}

state.list=loadLocal().map(migrate).sort((a,b)=>(a.creado||0)-(b.creado||0));
state.currentId=state.list.length?state.list[state.list.length-1].id:null;
syncFromSeg();writeLink();render();
window.addEventListener("storage",e=>{if(e.key===SEG_KEY){syncFromSeg();if(!isEditing())render()}});
setInterval(tick,1000);
connectDb();
})();
